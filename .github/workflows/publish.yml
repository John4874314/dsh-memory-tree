name: publish

# 只在打 tag（v1.2.3）时触发。平时 push / PR 不会跑这个。
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# 必需：OIDC 让 npm 验证「这个请求真的来自这个仓库」
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 只要 Node 本身。**刻意不传 registry-url**：
          # 传了它，setup-node 会往 .npmrc 写一行 `_authToken=${NODE_AUTH_TOKEN}`
          # 并注入一个占位值。npm 拿这个假 token 去认证，registry 认不出是谁 →
          # PUT 返回 **404**（不是 401/403），看着像「包不存在」，极难反推真因。
          node-version: 22

      # Trusted Publishing / OIDC 需要 npm >= 11.5.0。
      # Node 22 自带 npm 10.x，不升会报 ENEEDAUTH（老 npm 只认 token，不认 OIDC）。
      - name: 升级 npm（OIDC 需要 >= 11.5.0）
        run: |
          npm --version
          npm install -g npm@latest
          npm --version

      # ---------- 发布前自检：一条红的就不发 ----------
      # 引擎自测用的是自己写的 check 断言，失败时 process.exitCode = 1，
      # 所以直接 node 跑就行，不需要 --test 运行器。
      - name: 引擎自检
        run: |
          for f in test/*.test.mjs; do
            echo "=== $f ==="
            node "$f"
          done

      # ---------- 版本一致性：tag、package.json、README 首条必须相同 ----------
      - name: 校验版本一致性
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          README=$(grep -oP '^### \K[0-9]+\.[0-9]+\.[0-9]+' README.md | head -1 || true)
          echo "tag=$TAG  package.json=$PKG  README=${README:-<无>}"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$README" ]; then
            echo "::error::版本不一致：tag=$TAG package.json=$PKG README=${README:-<无>}"
            echo "::error::README.md 顶部需要一条 '### $TAG' 版本标题"
            exit 1
          fi

      # ---------- 确认包里没有多余文件 ----------
      - name: 打包清单检查
        run: |
          npm pack --dry-run 2>&1 | tee /tmp/pack.txt
          for bad in test/ .github/ node_modules/ .memory-tree/ memory-data/; do
            if grep -q "$bad" /tmp/pack.txt; then
              echo "::error::打包内容里出现了 $bad"
              exit 1
            fi
          done
          # 关键文件必须在包里，否则装上也用不了
          for need in index.js client.js cordis.patch.yml lib/engine.js; do
            if ! grep -q "$need" /tmp/pack.txt; then
              echo "::error::打包内容缺少 $need"
              exit 1
            fi
          done

      # ---------- 发布：用 OIDC，不需要任何 token ----------
      - name: Publish to npm
        # --provenance：生成公开可验证的构建来源证明，包页面显示 Provenance 徽章。
        # 不加 --access public：这个包名没有 scope，本身就是 public。
        run: npm publish --provenance
